events {
    worker_connections 1024;
}

http {
    # ── Allowed-origin map ───────────────────────────────────────────────────
    # Maps $http_origin to itself when it is an allowed origin, else "".
    # Used by the CORS headers below.  Must live in the http{} block.
    map $http_origin $cors_origin {
        default                               "";
        "~^https?://localhost(:[0-9]+)?$"     $http_origin;
        "~^https://[a-z0-9-]+\.vercel\.app$"  $http_origin;
        "~^https://nearusab\.me$"             $http_origin;
        "~^https://www\.nearusab\.me$"        $http_origin;
        "~^https://api\.nearusab\.me$"        $http_origin;
    }

    # ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name api.nearusab.me logs.nearusab.me;
        return 301 https://$host$request_uri;
    }

    # ── API (https://api.nearusab.me) ─────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name api.nearusab.me;

        ssl_certificate     /etc/letsencrypt/live/api.nearusab.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.nearusab.me/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            # ── CORS preflight short-circuit ─────────────────────────────────
            # OPTIONS requests must be answered at the nginx layer so that
            # [Authorize] endpoints never block the preflight with a 401/403
            # before CORS headers are written.
            # NOTE: add_header inside if{} is only valid inside a location{} block.
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin  always;
                add_header 'Access-Control-Allow-Credentials' 'true'        always;
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
                add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Requested-With' always;
                add_header 'Access-Control-Max-Age'           '86400'       always;
                return 204;
            }

            proxy_pass         http://nearu-api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        keep-alive;
            proxy_set_header   Host              $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ── Dozzle Logs (https://logs.nearusab.me) ───────────────────────────────
    server {
        listen 443 ssl;
        server_name logs.nearusab.me;

        # Uses the same expanded cert (covers both SANs)
        ssl_certificate     /etc/letsencrypt/live/api.nearusab.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.nearusab.me/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         http://dozzle:8080;
            proxy_http_version 1.1;
            # Dozzle uses SSE (Server-Sent Events) for streaming logs
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
        }
    }
}
