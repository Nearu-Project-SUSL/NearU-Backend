events {
    worker_connections 1024;
}

http {
    # ── Redirect HTTP → HTTPS for api ────────────────────────────────────────
    server {
        listen 80;
        server_name api.nearusab.me logs.nearusab.me;
        return 301 https://$host$request_uri;
    }

    # ── API (https://api.nearusab.me) ─────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name api.nearusab.me;

        ssl_certificate     /etc/letsencrypt/live/api.nearusab.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.nearusab.me/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # ── CORS preflight (OPTIONS) ─────────────────────────────────────────
        # Handle OPTIONS requests at the nginx layer so they never reach the
        # .NET middleware stack.  This prevents [Authorize] from blocking the
        # preflight with a 401/403 before the CORS headers are written.
        # The allowed-origins list must mirror what is in Program.cs.
        set $cors_origin "";
        if ($http_origin ~* "^(https?://localhost(:[0-9]+)?|https://[a-z0-9-]+\.vercel\.app|https://nearusab\.me|https://www\.nearusab\.me|https://api\.nearusab\.me)$") {
            set $cors_origin $http_origin;
        }

        # Respond to OPTIONS with 204 No Content and all necessary CORS headers
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'       always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, X-Requested-With' always;
            add_header 'Access-Control-Max-Age'           '86400'      always;
            add_header 'Content-Length'                   '0';
            return 204;
        }

        location / {
            proxy_pass         http://nearu-api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        keep-alive;
            proxy_set_header   Host              $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Forward CORS headers set by the .NET app on real requests
            proxy_hide_header  Access-Control-Allow-Origin;
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true'       always;
        }
    }

    # ── Dozzle Logs (https://logs.nearusab.me) ───────────────────────────────
    server {
        listen 443 ssl;
        server_name logs.nearusab.me;

        # Uses the same expanded cert (covers both SANs)
        ssl_certificate     /etc/letsencrypt/live/api.nearusab.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.nearusab.me/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         http://dozzle:8080;
            proxy_http_version 1.1;
            # Dozzle uses SSE (Server-Sent Events) for streaming logs
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
        }
    }
}
