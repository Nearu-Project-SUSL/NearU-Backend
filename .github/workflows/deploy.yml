name: CD — Build & Deploy on Merge

# Fires ONLY when a PR is merged into dev (or a direct push — which is
# blocked by branch protection rules, so this only runs after a reviewed merge).
on:
  push:
    branches: [ dev ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/nearu-project-susl/nearu-backend

jobs:

  # ─────────────────────────────────────────────────────────────
  # Job 1: Test Gate — ensures tests always pass before deploy,
  # even on direct pushes that bypass the CI PR check.
  # ─────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore main project
        run: dotnet restore NearU_Backend_Revised.csproj

      - name: Restore test project
        run: dotnet restore NearU_Backend.Tests/NearU_Backend.Tests.csproj

      - name: Build main project
        run: dotnet build NearU_Backend_Revised.csproj -c Release --no-restore

      - name: Build test project
        run: dotnet build NearU_Backend.Tests/NearU_Backend.Tests.csproj -c Release --no-restore

      - name: Run tests
        run: dotnet test NearU_Backend.Tests/NearU_Backend.Tests.csproj -c Release --no-build --verbosity normal

  # ─────────────────────────────────────────────────────────────
  # Job 2: Build & Push Docker Image to GHCR
  # Uses the built-in GITHUB_TOKEN (auto-managed, never expires)
  # instead of a Personal Access Token for the push step.
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Using the built-in GITHUB_TOKEN — auto-managed, never expires,
          # and scoped only to this workflow run.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  # ─────────────────────────────────────────────────────────────
  # Job 3: Deploy to Amazon Lightsail Instance
  # Uses GH_PAT for GHCR login (GITHUB_TOKEN is scoped to runs only).
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy docker-compose.yml and nginx.conf to Lightsail
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx.conf"
          target: "/home/ubuntu/"

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@master
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GH_PAT,GITHUB_ACTOR
          script: |
            set -e

            # ── 1. Login to GHCR ──────────────────────────────────────────────
            echo "$GH_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # ── 2. Copy updated configs into the deployment directory ─────────
            # /root/nearu-backend/ is owned by root; ubuntu needs sudo to write there.
            sudo cp /home/ubuntu/docker-compose.yml /root/nearu-backend/docker-compose.yml
            sudo cp /home/ubuntu/nginx.conf         /root/nearu-backend/nginx.conf

            # ── 3. Pull latest image & bring services up ──────────────────────
            # Must pass -f and --env-file explicitly because ubuntu cannot cd into
            # /root/nearu-backend (owned by root). sudo -E preserves the PATH.
            sudo -E docker compose \
              -f /root/nearu-backend/docker-compose.yml \
              --env-file /root/nearu-backend/.env \
              pull

            sudo -E docker compose \
              -f /root/nearu-backend/docker-compose.yml \
              --env-file /root/nearu-backend/.env \
              up -d

            # ── 4. Prune old images to reclaim disk space ─────────────────────
            docker system prune -f

            # ── 5. Health check — wait for API container to stabilise ─────────
            echo "⏳ Waiting 15 seconds for containers to stabilise..."
            sleep 15

            API_STATUS=$(docker inspect -f '{{.State.Status}}' nearu-api 2>/dev/null || echo "missing")
            if [ "$API_STATUS" != "running" ]; then
              echo "❌ Deployment failed: nearu-api is in state '$API_STATUS'"
              docker logs nearu-api --tail 30
              exit 1
            fi
            echo "✅ nearu-api is running."

            # ── 6. Gracefully reload nginx config (no full restart needed) ────
            # nginx -s reload re-reads nginx.conf without dropping connections.
            # If the config is invalid it prints an error but the old worker keeps
            # running — far safer than a full 'docker restart'.
            echo "🔄 Reloading nginx config..."
            docker exec nearu-nginx nginx -s reload

            sleep 3
            NGINX_STATUS=$(docker inspect -f '{{.State.Status}}' nearu-nginx 2>/dev/null || echo "missing")
            if [ "$NGINX_STATUS" != "running" ]; then
              echo "❌ Nginx failed after config reload!"
              docker logs nearu-nginx --tail 20
              exit 1
            fi

            echo "✅ Deployment complete and verified at $(date)"
